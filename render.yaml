# Render Blueprint: Dashboard > New > Blueprint > pick this repo.
# Values marked "sync: false" are asked for during setup (see README, "Deploy").
services:
  - type: web
    name: job-tracker-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /actuator/health
    envVars:
      # mysql (Aiven MySQL), postgres (Aiven/Neon PostgreSQL) or oracle
      - key: SPRING_PROFILES_ACTIVE
        value: mysql
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Random secrets generated by Render. Don't change ENCRYPTION_KEY later,
      # or stored Gmail connections can't be decrypted (users would reconnect Gmail).
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
