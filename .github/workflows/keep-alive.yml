# Render's free plan sleeps after 15 minutes without traffic, and waking takes 1-3 minutes.
# This pings the health endpoint every 10 minutes so the backend stays awake.
# (One always-on free service uses ~744 of Render's 750 free hours per month.)
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3 4 5 6; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://job-tracker-api-irr4.onrender.com/actuator/health || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 20
          done
          echo "Backend did not answer with 200"
          exit 1
